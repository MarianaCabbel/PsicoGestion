services:
  - type: web
    name: psicogestion-backend
    runtime: node
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm run start:server
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
